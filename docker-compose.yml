services:
  remotr:
    build:
      context: .
      dockerfile: Dockerfile
    image: remotr:latest
    container_name: remotr
    ports:
      - "9777:9777"
    environment:
      # Server reads REMOTR_PORT / REMOTR_HOST (see packages/server/src/cli.ts)
      - REMOTR_PORT=9777
      - REMOTR_HOST=0.0.0.0
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9777/remotr.js', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - remotr-network

networks:
  remotr-network:
    driver: bridge
