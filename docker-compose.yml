version: '3.8'

services:
  remotr:
    build:
      context: .
      dockerfile: Dockerfile
    image: remotr:latest
    container_name: remotr
    ports:
      - "9777:9777"
    environment:
      - NODE_ENV=production
      - PORT=9777
      # Optional: Configure host and room settings
      # - DEFAULT_ROOM=default
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9777/remotr.js', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
    - remotr-network

networks:
  remotr-network:
    driver: bridge
