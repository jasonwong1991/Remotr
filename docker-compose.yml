services:
  remotr:
    build:
      context: .
      dockerfile: Dockerfile
    image: remotr:latest
    container_name: remotr
    ports:
      - "9777:9777"
    environment:
      # Server reads REMOTR_PORT / REMOTR_HOST (see packages/server/src/cli.ts)
      - REMOTR_PORT=9777
      - REMOTR_HOST=0.0.0.0
      - NODE_ENV=production
      # Session replay recording (see packages/server/src/recording.ts)
      #   REMOTR_REC=off              disable recording (default: on)
      #   REMOTR_REC_SEGMENT_SEC=30   segment length in seconds
      #   REMOTR_REC_MAX_BYTES=1GB    disk quota (oldest segments dropped first)
      #   REMOTR_REC_DIR=/app/recordings  storage root (only the current day is kept)
      - REMOTR_REC=on
      - REMOTR_REC_SEGMENT_SEC=30
      - REMOTR_REC_MAX_BYTES=1GB
      - REMOTR_REC_DIR=/app/recordings
    volumes:
      # Persist same-day recordings across container restarts (only today is retained)
      - remotr-recordings:/app/recordings
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9777/remotr.js', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - remotr-network

volumes:
  remotr-recordings:

networks:
  remotr-network:
    driver: bridge
