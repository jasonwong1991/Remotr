<!DOCTYPE html>
<html>
<head><title>Picker Test</title></head>
<body>
  <h1>Heading Element</h1>
  <button id="test-btn" style="padding:30px; background:lightblue; font-size:16px;">
    Click Me to Test Picker
  </button>
  <div style="margin-top:20px; padding:20px; background:#f0f0f0;">
    <p>Paragraph element</p>
  </div>
  
  <script src="http://localhost:9777/remotr.js" data-room="picker-test"></script>
  
  <div style="margin-top:30px; padding:20px; border:2px solid #333;">
    <h3>Debug Info</h3>
    <pre id="debug-output">Loading...</pre>
  </div>
  
  <script>
    const output = document.getElementById('debug-output');
    
    setTimeout(() => {
      const info = [];
      info.push('REMOTR loaded: ' + !!window.REMOTR);
      info.push('SDK version: ' + (window.REMOTR?.SDK_VERSION || 'unknown'));
      
      // Check for rrweb record function
      if (window.record) {
        info.push('rrweb record found: true');
        info.push('record.mirror: ' + (typeof window.record.mirror));
        
        if (window.record.mirror) {
          const btn = document.getElementById('test-btn');
          const id = window.record.mirror.getId?.(btn);
        info.push('Button rrweb ID: ' + id);
    }
      } else {
        info.push('rrweb record: NOT FOUND');
      }
      
      output.textContent = info.join('\n');
    }, 2000);
  </script>
</body>
</html>
